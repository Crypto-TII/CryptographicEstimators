name: Verify publishing access (read only)
on:
  # Initial verification on this draft branch; never triggers image publication.
  push:
    branches:
      - codex/migrate-api-deployment-checkout
    paths:
      - .github/workflows/verify-aws-publishing-access.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aws-access:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Request a temporary AWS identity
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::450891466448:role/github-actions-estimators-ecr-push
          role-session-name: estimators-verify-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 900
          unset-current-credentials: true
          allowed-account-ids: '450891466448'
          aws-region: ca-central-1
      - name: Verify identity and read-only ECR access
        run: |
          aws sts get-caller-identity --query '{Account:Account,Arn:Arn}' --output json
          # Never print or persist an ECR authentication token.
          aws ecr get-authorization-token --registry-ids 450891466448 > /dev/null
          count=$(aws ecr describe-images --registry-id 450891466448 \
            --repository-name estimators-api --max-results 1 --no-paginate \
            --query 'length(imageDetails)' --output text)
          {
            echo '### Read-only AWS verification passed'
            echo 'OIDC role assumption, expected account, ECR authentication and API image metadata access succeeded.'
            echo "Image records sampled: $count. No image was built, uploaded, replaced or deployed."
            echo 'Actual upload permissions and cluster rollout remain untested.'
          } >> "$GITHUB_STEP_SUMMARY"

  private-api-access:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check effective GitHub App configuration without exposing values
        id: settings
        env:
          APP_ID: ${{ vars.API_CHECKOUT_APP_ID }}
          APP_KEY: ${{ secrets.API_CHECKOUT_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_KEY" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
            echo 'GitHub App checkout settings are available to this workflow.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            {
              echo '### Private API checkout remains unconfigured'
              if [ -z "$APP_ID" ]; then echo 'API_CHECKOUT_APP_ID is unavailable.'; fi
              if [ -z "$APP_KEY" ]; then echo 'API_CHECKOUT_APP_PRIVATE_KEY is unavailable.'; fi
              echo 'Configure a GitHub App with read-only Contents on the API repository, or make existing organization settings available to this repository.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Create read-only API checkout token
        if: steps.settings.outputs.configured == 'true'
        id: api-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.API_CHECKOUT_APP_ID }}
          private-key: ${{ secrets.API_CHECKOUT_APP_PRIVATE_KEY }}
          owner: Crypto-TII
          repositories: cryptographic-estimators-api
          permission-contents: read
      - name: Verify private API contents can be read
        if: steps.settings.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.api-token.outputs.token }}
        run: |
          gh api repos/Crypto-TII/cryptographic-estimators-api/contents/README.md --jq .type
          echo 'Read-only private API access verified; no repository content was changed.' >> "$GITHUB_STEP_SUMMARY"
