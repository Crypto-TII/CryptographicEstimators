name: build-deploy-to-staging
on:
  push:
    branches:
      - develop

# The API is private; the default GITHUB_TOKEN cannot read another repository.
permissions:
  contents: read

jobs:
  build-deploy-to-staging:
    runs-on: ubuntu-22.04
    concurrency: ci-${{github.ref}}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify private API checkout configuration
        env:
          API_CHECKOUT_APP_ID: ${{ vars.API_CHECKOUT_APP_ID }}
          API_CHECKOUT_APP_PRIVATE_KEY: ${{ secrets.API_CHECKOUT_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$API_CHECKOUT_APP_ID" ] || [ -z "$API_CHECKOUT_APP_PRIVATE_KEY" ]; then
            echo "::error::Configure API_CHECKOUT_APP_ID and API_CHECKOUT_APP_PRIVATE_KEY for read-only access to Crypto-TII/cryptographic-estimators-api."
            exit 1
          fi

      - name: Create read-only API checkout token
        id: api-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.API_CHECKOUT_APP_ID }}
          private-key: ${{ secrets.API_CHECKOUT_APP_PRIVATE_KEY }}
          owner: Crypto-TII
          repositories: cryptographic-estimators-api
          permission-contents: read

      - name: Checkout API repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Crypto-TII/cryptographic-estimators-api
          ref: master
          token: ${{ steps.api-token.outputs.token }}
          path: .api-source
          persist-credentials: false

      - name: Isolate API source from the public library build context
        env:
          API_SOURCE_DIR: ${{ runner.temp }}/cryptographic-estimators-api
        run: |
          # checkout paths must start inside GITHUB_WORKSPACE. Move the private
          # source out before any library image build or documentation build.
          test ! -e "$API_SOURCE_DIR"
          mv "$GITHUB_WORKSPACE/.api-source" "$API_SOURCE_DIR"
          test -f "$API_SOURCE_DIR/Dockerfile.integration"
          echo "API revision: $(git -C "$API_SOURCE_DIR" rev-parse HEAD)"
          printf 'API_SOURCE_DIR=%s\n' "$API_SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Configure AWS Credential for public AWS ECR
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to public AWS ECR
        id: login-ecr-public
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
        with:
          registry-type: public

      - name: Build and push staging library Docker image
        run: |
          docker build --tag public.ecr.aws/h0m6q0n8/staging/estimators/lib:latest .
          docker push public.ecr.aws/h0m6q0n8/staging/estimators/lib:latest

      - name: Configure AWS Credential for private AWS ECR
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: me-central-1

      - name: Login to private AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Build and push staging API Docker image
        env:
          API_IMAGE: ${{ steps.login-ecr.outputs.registry }}/staging/estimators/api:latest
        run: |
          docker build --tag "$API_IMAGE" \
            --file "$API_SOURCE_DIR/Dockerfile.integration" "$API_SOURCE_DIR"
          docker push "$API_IMAGE"

      - name: Reset staging AWS ECS task
        run: |
          aws ecs update-service                         \
            --cluster estimators-cluster                 \
            --service estimators-staging-service-tii-crc \
            --force-new-deployment

